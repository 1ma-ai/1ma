name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "brand/**"
      - "plugins/1ma-brand/**"
      - "plugins/1ma-theme/**"
      - "plugins/1ma-server-switcher/**"
      - "plugins/1ma-auto-updates/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
      - "scripts/lib/changed-paths.mjs"
      - "scripts/lib/workflow-result.mjs"
      - "!desktop/**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BB_DESKTOP_RELEASE_CHANNEL: latest
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  changes:
    name: Desktop paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        name: Does this pull request touch what the workflow checks
        env:
          # The list of `on.push.paths` above; scripts/lib/workflows.test.mjs holds them equal.
          PATHS: |
            desktop/**
            brand/**
            plugins/1ma-brand/**
            plugins/1ma-theme/**
            plugins/1ma-server-switcher/**
            plugins/1ma-auto-updates/**
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            .github/workflows/desktop.yml
            scripts/lib/changed-paths.mjs
            scripts/lib/workflow-result.mjs
            !desktop/**/*.md
        run: node scripts/lib/changed-paths.mjs

  patches:
    name: 1ma patches and rebrand apply to the pinned bb release
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
      - name: Install the desktop tooling
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter 1ma-desktop-tooling
      - name: Test the rebrand rules
        run: pnpm --filter 1ma-desktop-tooling run test
      - name: Prepare bb with the 1ma patches, assets and rebrand
        run: node desktop/scripts/prepare.mjs --out "$RUNNER_TEMP/bb"
      - name: Run bb's own source checks on the patched tree
        run: |
          base=$(node -p "require('./desktop/upstream.json').commit")
          cd "$RUNNER_TEMP/bb"
          node scripts/check-source-nul.mjs
          node scripts/check-provider-literal-ratchet.mjs --base "$base"
          node scripts/check-test-process-identity.mjs
          node scripts/check-branch-ref-owner.mjs
      - name: Keep the rebrand diff for review
        run: git -C "$RUNNER_TEMP/bb" diff HEAD~1 HEAD > "$RUNNER_TEMP/rebrand.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebrand-diff
          path: ${{ runner.temp }}/rebrand.diff
          if-no-files-found: error

  linux-server:
    name: Linux server package (bb-app tarball)
    needs: patches
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bb-src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
      - name: Install the desktop tooling
        working-directory: ${{ github.workspace }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter 1ma-desktop-tooling
      - name: Prepare bb with the 1ma patches, assets and rebrand
        working-directory: ${{ github.workspace }}
        run: |
          node desktop/scripts/prepare.mjs --out bb-src
          # bb-src sits inside this checkout; drop the tooling's packages so bb resolves only its own.
          rm -rf node_modules desktop/node_modules
      - name: Number the build (the next bb patch, as a prerelease naming this run)
        run: |
          set -euo pipefail
          version="$(node "$GITHUB_WORKSPACE/desktop/scripts/version.mjs" next \
            "$(jq -r .version packages/bb-app/package.json)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          node scripts/bump-version.mjs "$version"
          jq --arg version "$version" '.version = $version' 1ma-provenance.json > "$RUNNER_TEMP/provenance.json"
          mv "$RUNNER_TEMP/provenance.json" 1ma-provenance.json
          echo "1ma $version"
      - name: Enable the pnpm version bb pins
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/upstream.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Put the 1ma plugins in as built-in plugins
        run: node "$GITHUB_WORKSPACE/desktop/scripts/embed-plugins.mjs" "$PWD"
      - name: Typecheck the server and the plugins the 1ma patches touch, as bb's CI does
        run: pnpm exec turbo run typecheck --filter=@bb/server --filter=./plugins/* --continue --output-logs=errors-only
      - name: Build the server package and smoke-test its tarball, as bb does before publishing
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --force --output-logs=new-only
      - name: Pack the server package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server"
          (cd packages/bb-app && npm pack --pack-destination "$RUNNER_TEMP/server" --json > "$RUNNER_TEMP/pack.json")
          packed="$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")"
          version="$(jq -r .version packages/bb-app/package.json)"
          mv "$RUNNER_TEMP/server/$packed" "$RUNNER_TEMP/server/1ma-server-${version}.tgz"
          cp 1ma-provenance.json "$RUNNER_TEMP/server/"
      - name: Start the packed server from an empty folder and check the built-in 1ma plugins over HTTP
        run: node "$GITHUB_WORKSPACE/desktop/scripts/smoke-builtin-plugins.mjs" "$RUNNER_TEMP"/server/1ma-server-*.tgz
      - name: A change to an embedded 1ma plugin alone reaches the server package without --force
        run: |
          set -euo pipefail
          overview="$GITHUB_WORKSPACE/plugins/1ma-brand/PLUGIN_OVERVIEW.md"
          cp "$overview" "$RUNNER_TEMP/overview.md"
          marker="turbo-inputs-check-$GITHUB_RUN_ID"
          printf '\n<!-- %s -->\n' "$marker" >> "$overview"
          node "$GITHUB_WORKSPACE/desktop/scripts/embed-plugins.mjs" "$PWD"
          pnpm exec turbo run build --filter=bb-app --output-logs=errors-only
          cp "$RUNNER_TEMP/overview.md" "$overview"
          grep -q "$marker" packages/bb-app/server/dist/builtin-plugins/1ma-brand/PLUGIN_OVERVIEW.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 1ma-server-linux
          path: ${{ runner.temp }}/server/*
          if-no-files-found: error

  macos:
    name: macOS arm64 app (ad-hoc signed)
    needs: patches
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bb-src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
      - name: Install the desktop tooling
        working-directory: ${{ github.workspace }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter 1ma-desktop-tooling
      - name: Prepare bb with the 1ma patches, assets and rebrand
        working-directory: ${{ github.workspace }}
        run: |
          node desktop/scripts/prepare.mjs --out bb-src
          # bb-src sits inside this checkout; drop the tooling's packages so bb resolves only its own.
          rm -rf node_modules desktop/node_modules
      - name: Number the build (the next bb patch, as a prerelease naming this run)
        run: |
          set -euo pipefail
          version="$(node "$GITHUB_WORKSPACE/desktop/scripts/version.mjs" next \
            "$(jq -r .version packages/bb-app/package.json)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          node scripts/bump-version.mjs "$version"
          jq --arg version "$version" '.version = $version' 1ma-provenance.json > "$RUNNER_TEMP/provenance.json"
          mv "$RUNNER_TEMP/provenance.json" 1ma-provenance.json
          echo "1ma $version"
      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Enable the pnpm version bb pins
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/upstream.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Put the 1ma plugins in as built-in plugins
        run: node "$GITHUB_WORKSPACE/desktop/scripts/embed-plugins.mjs" "$PWD"
      - name: Typecheck desktop, launcher and config
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --filter=@bb/config --output-logs=new-only
      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --force --output-logs=new-only
      - name: Install Electron before parallel tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version
      - name: Test desktop, launcher and config
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --filter=@bb/config --force --continue --output-logs=new-only
      - name: Package the macOS app
        run: pnpm exec turbo run desktop:build --filter=@bb/desktop --force --output-logs=new-only
      - name: Verify the ad-hoc signature of the app in the DMG and the ZIP
        run: |
          set -euo pipefail
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            local details
            details="$(codesign --display --verbose=2 "$1" 2>&1)"
            printf '%s\n' "$details"
            if [[ $'\n'"$details"$'\n' != *$'\n'"Signature=adhoc"$'\n'* ]]; then
              echo "::error::$1 is not ad-hoc signed"
              return 1
            fi
          }
          check apps/desktop/release/mac-arm64/1ma.app
          mounted="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mounted" apps/desktop/release/*.dmg
          check "$mounted/1ma.app"
          hdiutil detach "$mounted"
          unzipped="$(mktemp -d)"
          ditto -x -k apps/desktop/release/*.zip "$unzipped"
          check "$unzipped/1ma.app"
      - name: Smoke test the packaged app
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only
      - name: Generate the version feed
        run: pnpm --dir apps/desktop run desktop:version-feed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 1ma-desktop-macos-arm64
          path: |
            bb-src/apps/desktop/release/*.dmg
            bb-src/apps/desktop/release/*.zip
            bb-src/apps/desktop/release/latest-mac.yml
            bb-src/apps/desktop/release/desktop-version.json
            bb-src/1ma-provenance.json
          if-no-files-found: error

  # The one check of this workflow that a merge into main requires: it reports on
  # every pull request. Touched paths need every job to succeed, untouched paths
  # need every job skipped; scripts/lib/workflow-result.mjs spells the verdict out,
  # because GitHub itself takes a skipped job for a passed one.
  result:
    name: Desktop result
    if: always()
    needs: [changes, patches, linux-server, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every job the event calls for passed, or the paths are untouched
        env:
          NEEDS: ${{ toJSON(needs) }}
          OFF_PULL_REQUESTS: linux-server macos
        run: node scripts/lib/workflow-result.mjs
