name: Desktop release

# Publishes the macOS app and the Linux server package of one Desktop workflow
# run as the pre-release desktop/v<version>, then points the version feeds in
# the desktop-latest release at it: desktop-version.json for the app and
# server-version.json for the server's self-update. The run is checked against
# GitHub's own records, not against files inside its artifact: it must be a
# green Desktop build of main in this repository, and bb's tests must have
# passed on the same commit in a push run on main.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Desktop workflow run on main whose macOS app and Linux server should be published"
        required: true
      dry_run:
        description: "Check the run and prepare the files, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# One release at a time: two runs could otherwise both pass the "only forward"
# check on the feeds and the older one could upload last.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a 1ma Desktop test build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The job has no checkout, so gh release needs the repository named.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the build run and bb's tests for its commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || fail "run_id must be a run number"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          field() { jq -r "$1" run.json; }
          [[ "$(field .path)" == ".github/workflows/desktop.yml" ]] ||
            fail "run $RUN_ID is $(field .path), not a Desktop build"
          [[ "$(field .event)" == "push" || "$(field .event)" == "workflow_dispatch" ]] ||
            fail "run $RUN_ID was triggered by $(field .event); only push and manual runs on main are published"
          [[ "$(field .head_branch)" == "main" ]] || fail "run $RUN_ID built $(field .head_branch), not main"
          [[ "$(field .head_repository.full_name)" == "$GITHUB_REPOSITORY" ]] ||
            fail "run $RUN_ID built code from $(field .head_repository.full_name)"
          [[ "$(field .conclusion)" == "success" ]] || fail "run $RUN_ID did not succeed"
          commit="$(field .head_sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || fail "run $RUN_ID has no commit"
          gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status > ancestry
          [[ "$(cat ancestry)" == "ahead" || "$(cat ancestry)" == "identical" ]] ||
            fail "$commit is not on main"
          tests="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-tests.yml/runs?head_sha=$commit&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')"
          [[ "$tests" == "success" ]] ||
            fail "the latest push run of desktop-tests.yml on main for $commit is '$tests'; bb's tests must pass on the 1ma tree before publishing"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the version tool at the build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.commit }}
          path: 1ma
          sparse-checkout: desktop/scripts
          persist-credentials: false
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name 1ma-desktop-macos-arm64 --dir dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name 1ma-server-linux --dir dist-server
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          COMMIT: ${{ steps.build.outputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          for record in dist/1ma-provenance.json dist-server/1ma-provenance.json; do
            provenance="$(jq -r .oneMaCommit "$record")"
            [[ "$provenance" == "$COMMIT" ]] ||
              fail "$record says it was built from '$provenance', but run $RUN_ID built $COMMIT"
          done
          version="$(jq -r .version dist/apps/desktop/release/desktop-version.json)"
          node 1ma/desktop/scripts/version.mjs compare "$version" "$version" >/dev/null ||
            fail "unexpected version '$version'"
          [[ "$version" == *"-1ma.${RUN_ID}."* ]] ||
            fail "run $RUN_ID built version '$version', which does not name the run"
          for record in dist/1ma-provenance.json dist-server/1ma-provenance.json; do
            [[ "$(jq -r .version "$record")" == "$version" ]] ||
              fail "$record is for version $(jq -r .version "$record"), not $version"
          done
          upstream="$(jq -r .upstream.tag dist/1ma-provenance.json)"
          tag="desktop/v${version}"
          mkdir upload feeds
          cp dist/apps/desktop/release/*.dmg dist/apps/desktop/release/*.zip upload/
          server="dist-server/1ma-server-${version}.tgz"
          [[ -f "$server" ]] || fail "run $RUN_ID has no Linux server package for $version"
          cp "$server" upload/
          (cd upload && sha256sum -- * > SHA256SUMS)
          cp dist/apps/desktop/release/desktop-version.json feeds/
          jq -n --arg version "$version" --arg commit "$COMMIT" --arg bb "$upstream" \
            '{schemaVersion: 1, channel: "latest", version: $version, release: ("desktop/v" + $version),
              package: ("1ma-server-" + $version + ".tgz"), commit: $commit, bb: $bb}' > feeds/server-version.json
          cat > notes.md <<NOTES
          Test build of 1ma ${version} for macOS on Apple Silicon, built from bb ${upstream} with the 1ma patches at ${COMMIT}. Download the .dmg; SHA256SUMS lists the checksums.

          1ma-server-${version}.tgz is the 1ma server for Linux from the same commit (bb's bb-app package with the 1ma patches and rebrand; the command keeps the name bb-app for now). Install it with npm install <file> in an empty folder and start node_modules/.bin/bb-app with Node 24. It updates itself from the releases of this repository; ONEMA_UPDATE_COMMAND_PREFIX runs its npm install under a wrapper, such as a resource limit. Builds older than 0.49.1 install bb from npm instead and must be started with --no-in-app-updates.

          The build is signed ad hoc, not by Apple yet. First launch: open 1ma once, then System Settings > Privacy & Security > Open Anyway, and enter your password. macOS treats every test build as a new app, so it asks again after each update, also for permissions such as the microphone.

          Quit bb completely before opening 1ma: both use port 38886. 1ma keeps its data in ~/.1ma, separate from bb.
          NOTES
          # GITHUB_TOKEN may not create a release on a commit that changes workflow files
          # (HTTP 403). A maintainer then creates the pre-release with the tag at the build
          # commit, and a rerun of this workflow uploads the files into it.
          # Fails on any error other than a missing release, so a dry run cannot pass
          # on a check that never ran.
          if gh release view "$tag" --json tagName >/dev/null 2>release-view.err; then
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            [[ "$tagged" == "$COMMIT" ]] || fail "$tag points at $tagged, not at the build commit $COMMIT"
          elif ! grep -q "release not found" release-view.err; then
            fail "cannot read release $tag: $(cat release-view.err)"
          fi
          # The feeds only move forward: an older run never replaces a newer one.
          # Every feed this run replaces is checked, since a release that failed
          # halfway can leave one feed ahead of another.
          # A feed can be lost by a failed upload (--clobber removes the old file
          # first); a published release cannot, so the newest release tag is the
          # floor as well.
          patterns=()
          for file in feeds/*; do patterns+=(--pattern "$(basename "$file")"); done
          mkdir -p announced
          if ! gh release download desktop-latest "${patterns[@]}" --dir announced 2>feed.err; then
            if grep -q "release not found" feed.err; then
              fail "the desktop-latest release is missing; a maintainer creates it once (desktop/README.md)"
            elif ! grep -qE "no assets (match|to download)" feed.err; then
              fail "cannot read desktop-latest: $(cat feed.err)"
            fi
          fi
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > published-tags ||
            fail "cannot list the published releases"
          node 1ma/desktop/scripts/version.mjs forward "$version" announced published-tags ||
            fail "the feeds in desktop-latest only move forward"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "dry run: would publish $tag at $COMMIT with:"
            cat upload/SHA256SUMS
            echo "and point desktop-latest at it:"
            cat feeds/server-version.json
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # A published file is never replaced: one that is already there
            # must be the same file, and only missing ones are uploaded.
            gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.digest)"' > existing
            for file in upload/*; do
              name="$(basename "$file")"
              digest="$(awk -v name="$name" '$1 == name { print $2 }' existing)"
              if [[ -z "$digest" ]]; then
                gh release upload "$tag" "$file"
              elif [[ "$digest" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
                fail "$tag already has a different $name; refusing to replace a published file"
              fi
            done
          else
            gh release create "$tag" --prerelease --target "$COMMIT" \
              --title "1ma ${version}" \
              --notes-file notes.md \
              upload/*
          fi
          echo "published $tag"
          gh release upload desktop-latest feeds/* --clobber
          echo "desktop-latest now announces $version"
