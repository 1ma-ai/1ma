name: Desktop release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Desktop workflow run whose macOS build should be published"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish a 1ma Desktop test build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 1ma-desktop-macos-arm64
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          ls -R dist
          version=$(node -p "require('./dist/apps/desktop/release/desktop-version.json').version")
          upstream=$(node -p "require('./dist/1ma-provenance.json').upstream.tag")
          commit=$(node -p "require('./dist/1ma-provenance.json').oneMaCommit")
          tag="desktop/v${version}-1ma.${RUN_ID}"
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow desktop-tests.yml --commit "$commit" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" = "0" ]; then
            echo "::error::bb's tests have not passed on the 1ma tree for ${commit}; a green desktop-tests.yml run is required before publishing."
            exit 1
          fi
          cat > notes.md <<NOTES
          Test build of 1ma Desktop for macOS on Apple Silicon, built from bb ${upstream} with the 1ma patches at ${commit}.

          The build is signed ad hoc, not by Apple yet. First launch: open 1ma once, then System Settings > Privacy & Security > Open Anyway, and enter your password.

          Quit bb completely before opening 1ma: both use port 38886. 1ma keeps its data in ~/.1ma, separate from bb.
          NOTES
          files=(dist/apps/desktop/release/*.dmg dist/apps/desktop/release/*.zip)
          # GITHUB_TOKEN may not create a release on a commit that changes workflow files
          # (HTTP 403). A maintainer then creates the pre-release with these notes and the
          # tag at the build commit, and a rerun of this workflow uploads the files into it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" --prerelease --target "$commit" \
              --title "1ma Desktop ${version} test build ${RUN_ID}" \
              --notes-file notes.md \
              "${files[@]}"
          fi
          echo "published $tag"
