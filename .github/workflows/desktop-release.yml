name: Desktop release

# Publishes the macOS app and the Linux server package of one Desktop workflow
# run as the pre-release desktop/v<version>, then points the version feeds in
# the desktop-latest release at it: desktop-version.json for the app and
# server-version.json for the server's self-update. The run is checked against
# GitHub's own records, not against files inside its artifact: it must be a
# green Desktop build of main in this repository, and bb's tests must have
# passed on the same commit in a push run on main. desktop/scripts/release.mjs
# does the publishing; a dry run goes the same way with the writes left out,
# with the same reads and checks up to its first write, including the
# comparison with the files a release of the tag already holds and the read of
# each file it would remove at its address. It cannot read the release of the
# tag as an upload into it would leave it, and says so.
# A publication is started from main; a dry run may be started from a branch,
# to try its copy of this file and of the tool. Both accept only files of the
# attempt whose result the first step checked; a dry run is a check, not an
# approval of the bytes, and a publication repeats every check.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Desktop workflow run on main whose macOS app and Linux server should be published"
        required: true
      dry_run:
        description: "Check the run and prepare the files, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# One release at a time: two runs could otherwise both pass the "only forward"
# check on the feeds and the older one could upload last. An edit of the
# releases by hand is not held back by this; the tool acts on a fresh picture
# for each group of writes and checks what the feeds announce as a whole
# before the first write to them and in the last read; the windows that stay
# open are in desktop/README.md.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a 1ma Desktop test build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the build run and bb's tests for its commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || fail "run_id must be a run number"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          field() { jq -r "$1" run.json; }
          [[ "$(field .path)" == ".github/workflows/desktop.yml" ]] ||
            fail "run $RUN_ID is $(field .path), not a Desktop build"
          [[ "$(field .event)" == "push" || "$(field .event)" == "workflow_dispatch" ]] ||
            fail "run $RUN_ID was triggered by $(field .event); only push and manual runs on main are published"
          [[ "$(field .head_branch)" == "main" ]] || fail "run $RUN_ID built $(field .head_branch), not main"
          [[ "$(field .head_repository.full_name)" == "$GITHUB_REPOSITORY" ]] ||
            fail "run $RUN_ID built code from $(field .head_repository.full_name)"
          [[ "$(field .conclusion)" == "success" ]] || fail "run $RUN_ID did not succeed"
          # The conclusion is the latest attempt's; release.mjs takes only its files.
          attempt="$(field .run_attempt)"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]] || fail "run $RUN_ID has no attempt number"
          commit="$(field .head_sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || fail "run $RUN_ID has no commit"
          gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status > ancestry
          [[ "$(cat ancestry)" == "ahead" || "$(cat ancestry)" == "identical" ]] ||
            fail "$commit is not on main"
          tests="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-tests.yml/runs?head_sha=$commit&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')"
          [[ "$tests" == "success" ]] ||
            fail "the latest push run of desktop-tests.yml on main for $commit is '$tests'; bb's tests must pass on the 1ma tree before publishing"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
      # The tools come from the commit this workflow runs at, not from the build
      # commit, which is an ancestor of main (checked above) and may predate
      # them. release.mjs publishes only in a run started from main, so the
      # rules that publish are main's; a dry run may try a branch's tools.
      - name: Check out the release tools at the workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 1ma
          sparse-checkout: desktop/scripts
          persist-credentials: false
      # The Node the tool's tests run on in desktop.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name 1ma-desktop-macos-arm64 --dir dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name 1ma-server-linux --dir dist-server
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ steps.build.outputs.attempt }}
          COMMIT: ${{ steps.build.outputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST: dist
          DIST_SERVER: dist-server
          WORK: ${{ runner.temp }}/release
        run: node 1ma/desktop/scripts/release.mjs
