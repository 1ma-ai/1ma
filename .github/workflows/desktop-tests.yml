name: Desktop bb tests

# Runs bb's own test suite, in the shards bb's CI uses, and bb's lint and
# typecheck on the tree 1ma Desktop builds from: the pinned bb release with the
# 1ma patches, assets and rebrand.
# A manual run with rebrand=false gives the baseline without the rebrand.
# The paths cover everything the Desktop build depends on, so every build on
# main has a test run for its commit: desktop-release.yml requires one.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "brand/**"
      - "plugins/1ma-brand/**"
      - "plugins/1ma-theme/**"
      - "plugins/1ma-server-switcher/**"
      - "plugins/1ma-auto-updates/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-tests.yml"
      - "scripts/lib/changed-paths.mjs"
      - "scripts/lib/workflow-result.mjs"
      - "!desktop/**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      rebrand:
        description: "Apply the 1ma rebrand before testing"
        type: boolean
        default: true

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  changes:
    name: Desktop bb tests paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        name: Does this pull request touch what the workflow checks
        env:
          # The list of `on.push.paths` above; scripts/lib/workflows.test.mjs holds them equal.
          PATHS: |
            desktop/**
            brand/**
            plugins/1ma-brand/**
            plugins/1ma-theme/**
            plugins/1ma-server-switcher/**
            plugins/1ma-auto-updates/**
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            .github/workflows/desktop.yml
            .github/workflows/desktop-tests.yml
            scripts/lib/changed-paths.mjs
            scripts/lib/workflow-result.mjs
            !desktop/**/*.md
        run: node scripts/lib/changed-paths.mjs

  plan:
    name: Read bb's test shards
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.shards.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: shards
        name: Plan the shards with bb's own CI planner at the pinned commit
        run: |
          set -euo pipefail
          commit=$(node -p "require('./desktop/upstream.json').commit")
          planner="$RUNNER_TEMP/bb-plan"
          mkdir -p "$planner/scripts"
          for file in plan-ci.mjs ci-test-shards.json; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/get-bb/bb/${commit}/scripts/${file}" -o "$planner/scripts/${file}"
          done
          (cd "$planner" && node scripts/plan-ci.mjs --full) > "$RUNNER_TEMP/selection.json"
          node desktop/scripts/shard-matrix.mjs "$RUNNER_TEMP/selection.json"

  static:
    name: bb lint and typecheck
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - name: Install the desktop tooling
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter 1ma-desktop-tooling
      - name: Prepare bb with the 1ma patches, assets and rebrand
        env:
          REBRAND: ${{ github.event_name != 'workflow_dispatch' || inputs.rebrand }}
        run: |
          args=(--out "$RUNNER_TEMP/bb-src")
          if [[ "$REBRAND" == "false" ]]; then args+=(--no-rebrand); fi
          node desktop/scripts/prepare.mjs "${args[@]}"
      - name: Install bb's own pnpm, as bb's CI does
        working-directory: ${{ runner.temp }}/bb-src
        run: |
          version="$(node --print 'require("./package.json").packageManager.replace(/^pnpm@/, "")')"
          GITHUB_WORKSPACE="$PWD" PNPM_VERSION="$version" bash .github/actions/setup-workspace/install-pnpm.sh
      - name: Install bb dependencies
        working-directory: ${{ runner.temp }}/bb-src
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - name: Put the 1ma plugins in as built-in plugins
        working-directory: ${{ runner.temp }}/bb-src
        run: node "$GITHUB_WORKSPACE/desktop/scripts/embed-plugins.mjs" "$PWD"
      # bb's static-checks job. bb forbids code comments in the packages that
      # have a lint script, and its type-aware lint catches promises left
      # unhandled; a patch that breaks either would otherwise pass here.
      - name: Lint and typecheck, as bb's CI does
        working-directory: ${{ runner.temp }}/bb-src
        run: pnpm exec turbo run lint lint:type-aware typecheck --continue --output-logs=errors-only --concurrency=4

  tests:
    name: bb tests (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - name: Install the desktop tooling
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter 1ma-desktop-tooling
      - name: Prepare bb with the 1ma patches, assets and rebrand
        env:
          REBRAND: ${{ github.event_name != 'workflow_dispatch' || inputs.rebrand }}
        run: |
          args=(--out "$RUNNER_TEMP/bb-src")
          if [[ "$REBRAND" == "false" ]]; then args+=(--no-rebrand); fi
          node desktop/scripts/prepare.mjs "${args[@]}"
      - name: Install bb's own pnpm, as bb's CI does
        working-directory: ${{ runner.temp }}/bb-src
        run: |
          version="$(node --print 'require("./package.json").packageManager.replace(/^pnpm@/, "")')"
          GITHUB_WORKSPACE="$PWD" PNPM_VERSION="$version" bash .github/actions/setup-workspace/install-pnpm.sh
      - name: Install bb dependencies for this shard
        working-directory: ${{ runner.temp }}/bb-src
        env:
          APP_SHARD: ${{ startsWith(matrix.shard, 'app-') }}
          DEMO_ONLY: ${{ matrix.filter == '--filter=@bb/demo-server' }}
          MOBILE_TESTS: ${{ matrix.mobile }}
        run: |
          filters=()
          if [[ "$APP_SHARD" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/app...' --filter '@bb/db...')
          elif [[ "$DEMO_ONLY" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/demo-server...' --filter '@bb/db...')
          elif [[ "$MOBILE_TESTS" != "true" ]]; then
            filters=(--filter '!@bb/mobile')
          fi
          bash .github/actions/setup-workspace/install-dependencies.sh "${filters[@]}"
      - name: Put the 1ma plugins in as built-in plugins
        working-directory: ${{ runner.temp }}/bb-src
        run: node "$GITHUB_WORKSPACE/desktop/scripts/embed-plugins.mjs" "$PWD"
      - name: Regenerate the PWA icon variants from the 1ma icons, as bb's app build does
        if: startsWith(matrix.shard, 'app-')
        working-directory: ${{ runner.temp }}/bb-src
        run: pnpm --filter @bb/app run generate:pwa-icons
      - name: Set up Bun
        if: startsWith(matrix.shard, 'packages-') || startsWith(matrix.shard, 'plugins-')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install Electron runtime libraries
        if: contains(matrix.filter, '--filter=@bb/desktop')
        working-directory: ${{ runner.temp }}/bb-src
        run: |
          bash .github/actions/setup-workspace/install-electron-libraries.sh
          ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version
      # Owner decision 24.11.2026: tests of bb parts 1ma does not ship are not
      # run. @bb/ai-gateway is bb's cloud AI gateway (its rate-limit test counts
      # per clock minute and fails when the requests straddle one);
      # @bb/connect-next is bb's hosted connection gateway (its region test
      # restarts frps and failed when the restart did not come up, run
      # 46126332987, on a bb tree that passed six times before); pr-approval-workflows tests bb's own GitHub PR gate (pr-gate.yml) and
      # times out on loaded runners. rm fails once bb moves the file, so the
      # entry is reviewed with the new release.
      - name: Leave out the tests of bb parts 1ma does not ship
        working-directory: ${{ runner.temp }}/bb-src
        run: rm packages/scripts/test/pr-approval-workflows.test.ts
      - name: Test
        working-directory: ${{ runner.temp }}/bb-src
        env:
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
          VITEST_MAX_WORKERS: ${{ (startsWith(matrix.shard, 'server-') || matrix.shard == 'integration') && '4' || '2' }}
        # Failures bb's own CI does not see (another git, faster runners) are listed
        # with a reason in desktop/known-test-failures.json; any other failure fails.
        run: |
          set +e
          ${{ contains(matrix.filter, '--filter=@bb/desktop') && 'xvfb-run -a' || '' }} pnpm exec turbo run test ${{ matrix.filter }} --filter='!@bb/ai-gateway' --filter='!@bb/connect-next' --continue --output-logs=new-only --concurrency=4 2>&1 | tee "$RUNNER_TEMP/test.log"
          status="${PIPESTATUS[0]}"
          set -e
          node "$GITHUB_WORKSPACE/desktop/scripts/known-test-failures.mjs" "$RUNNER_TEMP/test.log" "$status"
      - name: Test native browser address interactions
        if: contains(matrix.filter, '--filter=@bb/desktop')
        working-directory: ${{ runner.temp }}/bb-src
        run: xvfb-run -a pnpm exec turbo run smoke:browser-address --filter=@bb/desktop --output-logs=new-only

  # The one check of this workflow that a merge into main requires: it reports on
  # every pull request. Touched paths need every job to succeed, untouched paths
  # need every job skipped; scripts/lib/workflow-result.mjs spells the verdict out,
  # because GitHub itself takes a skipped job for a passed one.
  result:
    name: Desktop bb tests result
    if: always()
    needs: [changes, plan, static, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job the event calls for passed, or the paths are untouched
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/lib/workflow-result.mjs
