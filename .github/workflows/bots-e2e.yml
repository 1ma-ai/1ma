name: Bots end-to-end

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bots-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  changes:
    name: Bots end-to-end paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        name: Does this pull request touch what the workflow checks
        env:
          # The last three are how the plugins are installed and built: bb-app's
          # own SDK comes from packageExtensions in pnpm-workspace.yaml.
          PATHS: |
            plugins/1ma-bots/**
            plugins/1ma-sidebar/**
            e2e/bots/**
            e2e/lib/**
            .github/workflows/bots-e2e.yml
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
        run: node scripts/lib/changed-paths.mjs

  e2e:
    name: One 1ma server with the bots and sidebar plugins
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Choose the scratch directories
        run: |
          echo "E2E_ROOT=$RUNNER_TEMP/bots-e2e" >> "$GITHUB_ENV"
          echo "E2E_PLAYWRIGHT_DIR=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned 1ma server package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node e2e/lib/install-server.mjs
      - name: Build the plugins with the server's own bb
        run: |
          bb="$E2E_ROOT/server-package/node_modules/bb-app/dist/bb.js"
          for plugin in 1ma-bots 1ma-sidebar; do
            (cd "plugins/$plugin" && node "$bb" plugin build)
          done
      - name: Install Chromium for Playwright
        run: |
          mkdir -p "$E2E_PLAYWRIGHT_DIR"
          cd "$E2E_PLAYWRIGHT_DIR"
          npm init -y
          npm install --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: node --test --test-concurrency=1 --test-timeout=2400000 e2e/bots/bots.test.mjs
      - name: Server logs
        if: always()
        run: |
          for log in "$E2E_ROOT"/*.log "$E2E_ROOT"/bots/*.log "$E2E_ROOT"/bots/*/data/logs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
          done
      - name: Sidebar screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bots-sidebar-screenshots
          path: ${{ env.E2E_ROOT }}/bots/screenshots
          if-no-files-found: warn

  # The one check of this workflow that a merge into main requires: it reports on
  # every pull request, also when the paths above are untouched and the jobs are
  # skipped.
  result:
    name: Bots end-to-end result
    if: always()
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The paths were read, and no job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::the changed paths were not read"
            exit 1
          fi
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then
            echo "::error::a job of this workflow failed or was cancelled"
            exit 1
          fi
