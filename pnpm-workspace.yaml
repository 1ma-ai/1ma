packages:
  - "plugins/*"
  - "desktop"

# bb installs plugins from git with plain npm inside each plugin directory,
# so every plugin stays installable on its own: no workspace: specifiers in
# plugin dependencies, each plugin brings its own runtime dependencies.

# Native modules of bb-app (used here only for `bb plugin build`) and esbuild
# need their install scripts; everything else stays script-free.
allowBuilds:
  better-sqlite3: true
  node-pty: true
  "@parcel/watcher": true
  esbuild: true

minimumReleaseAgeExclude:
  - bb-app@0.48.1

# bb-app builds plugin bundles against the plugin SDK it resolves from its
# own install. It does not declare that dependency, so pnpm would hand it the
# hoisted SDK of whichever plugin pins an older one, and the build would miss
# newer runtime exports. Give it the SDK of its own release; update both
# versions together with devDependencies.bb-app.
packageExtensions:
  bb-app@0.49.0:
    dependencies:
      "@get-bb/plugin-sdk": "0.6.132"
